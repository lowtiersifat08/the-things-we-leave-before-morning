<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Things We Leave Before Morning</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #faf6f0;
    --bg-alt: #f0e9df;
    --ink: #241f1a;
    --ink-soft: #5c5346;
    --accent: #8a1f3b;
    --accent-soft: #b8495f;
    --gold: #a9802f;
    --line: #ddd2c0;
    --card: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #130f0d;
      --bg-alt: #1c1611;
      --ink: #ece4d6;
      --ink-soft: #b5a994;
      --accent: #d9728c;
      --accent-soft: #b8495f;
      --gold: #d4af5f;
      --line: #342a20;
      --card: #1c1611;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg: #130f0d;
    --bg-alt: #1c1611;
    --ink: #ece4d6;
    --ink-soft: #b5a994;
    --accent: #d9728c;
    --accent-soft: #b8495f;
    --gold: #d4af5f;
    --line: #342a20;
    --card: #1c1611;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    margin:0;
    transition: background .4s ease, color .4s ease;
  }
  .serif{ font-family:'Cormorant Garamond', serif; }
  .texture{
    background-image: radial-gradient(circle at 20% 20%, rgba(169,128,47,0.06), transparent 40%),
                       radial-gradient(circle at 80% 70%, rgba(138,31,59,0.06), transparent 45%);
  }
  .gold-rule{ height:1px; background:linear-gradient(90deg, transparent, var(--gold), transparent); }
</style>
</head>
<body class="texture min-h-screen flex flex-col justify-between">

  <!-- Theme toggle -->
  <button id="themeToggle" aria-label="Toggle light and dark mode"
    class="fixed top-4 right-4 z-50 w-10 h-10 rounded-full border flex items-center justify-center cursor-pointer shadow-sm"
    style="border-color:var(--line); background:var(--card); color:var(--ink);" onclick="toggleTheme()">
    <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <!-- Hero Section -->
  <main class="max-w-4xl mx-auto px-6 pt-20 pb-16 my-auto text-center">
    <p class="text-xs uppercase tracking-widest mb-4 font-medium" style="color:var(--gold);">A Short Story</p>
    
    <h1 class="serif text-4xl sm:text-6xl font-normal leading-tight mb-6" style="color:var(--ink);">
      The Things We Leave Before Morning
    </h1>
    
    <div class="gold-rule w-32 mx-auto mb-8"></div>
    
    <p class="max-w-xl mx-auto text-lg leading-relaxed mb-10" style="color:var(--ink-soft);">
      A quietly gripping tale exploring memory, departure, and the fragile quiet of dawn. Discover what remains when everything else is left behind.
    </p>

    <!-- Buy Button linked to Gumroad -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
      <a href="https://sifatkhan6.gumroad.com/l/qrfuen" 
         class="w-full sm:w-auto px-8 py-4 rounded-full font-medium text-white shadow-lg transition-transform hover:scale-105 active:scale-95"
         style="background:var(--accent);">
        Buy Now on Gumroad
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-6 text-center text-xs border-t" style="border-color:var(--line); color:var(--ink-soft);">
    &copy; Sifat Khan. All rights reserved.
  </footer>

  <script>
    function toggleTheme() {
      const root = document.documentElement;
      const current = root.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      
      document.getElementById('iconMoon').classList.toggle('hidden', next === 'dark');
      document.getElementById('iconSun').classList.toggle('hidden', next !== 'dark');
    }
  </script>
</body>
</html>
