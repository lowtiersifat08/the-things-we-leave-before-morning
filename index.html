<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Things We Leave Before Morning</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #faf6f0;
    --bg-alt: #f0e9df;
    --ink: #241f1a;
    --ink-soft: #5c5346;
    --accent: #8a1f3b;
    --accent-soft: #b8495f;
    --gold: #a9802f;
    --line: #ddd2c0;
    --card: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #130f0d;
      --bg-alt: #1c1611;
      --ink: #ece4d6;
      --ink-soft: #b5a994;
      --accent: #d9728c;
      --accent-soft: #b8495f;
      --gold: #d4af5f;
      --line: #342a20;
      --card: #1c1611;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg: #130f0d;
    --bg-alt: #1c1611;
    --ink: #ece4d6;
    --ink-soft: #b5a994;
    --accent: #d9728c;
    --accent-soft: #b8495f;
    --gold: #d4af5f;
    --line: #342a20;
    --card: #1c1611;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    margin:0;
    transition: background .4s ease, color .4s ease;
  }
  .serif{ font-family:'Cormorant Garamond', serif; }
  .texture{
    background-image: radial-gradient(circle at 20% 20%, rgba(169,128,47,0.06), transparent 40%),
                       radial-gradient(circle at 80% 70%, rgba(138,31,59,0.06), transparent 45%);
  }
  .fade-up{ opacity:0; transform: translateY(18px); transition: opacity .8s ease, transform .8s ease; }
  .fade-up.show{ opacity:1; transform: translateY(0); }
  .ripple-btn{ position:relative; overflow:hidden; }
  .ripple-btn span.ripple{
    position:absolute; border-radius:50%; background:rgba(255,255,255,0.35);
    transform:scale(0); animation:ripple .6s linear; pointer-events:none;
  }
  @keyframes ripple{ to{ transform:scale(4); opacity:0; } }
  .gold-rule{ height:1px; background:linear-gradient(90deg, transparent, var(--gold), transparent); }
  .clock-spin{ animation: spin 90s linear infinite; transform-origin:center; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  input[type=number]::-webkit-inner-spin-button{ opacity:1; }
  .theme-toggle{ transition: transform .3s ease; }
  .theme-toggle:active{ transform: scale(0.9); }
</style>
</head>
<body class="texture">

  <!-- Theme toggle -->
  <button id="themeToggle" aria-label="Toggle light and dark mode"
    class="theme-toggle fixed top-4 right-4 z-50 w-10 h-10 rounded-full border flex items-center justify-center"
    style="border-color:var(--line); background:var(--card); color:var(--ink);">

    <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
